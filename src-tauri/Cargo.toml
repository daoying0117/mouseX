[package]
name = "mousex"
version = "1.0.0"
description = "MouseX polling rate tester"
authors = ["MouseX"]
edition = "2021"

[lib]
name = "mousex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
once_cell = "1"
rdev = "0.5"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
